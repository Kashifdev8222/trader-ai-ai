<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="cpBotBody" x1="70" y1="118" x2="150" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="cpBotHead" x1="76" y1="28" x2="144" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#faf8ff"/>
      <stop offset="1" stop-color="#e8e2ff"/>
    </linearGradient>
    <linearGradient id="cpBotVisor" x1="78" y1="68" x2="142" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f3bc9"/>
      <stop offset="0.45" stop-color="#725aee"/>
      <stop offset="1" stop-color="#5f48d8"/>
    </linearGradient>
    <clipPath id="cpBotVisorClip">
      <rect x="76" y="58" width="68" height="22" rx="11"/>
    </clipPath>
    <filter id="cpBotDrop" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#725aee" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Floor glow -->
  <ellipse cx="110" cy="188" rx="62" ry="7" fill="#725aee" opacity="0.11">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="2.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Slow orbit ring -->
  <g transform="translate(110, 95)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="72" ry="40" fill="none" stroke="#725aee" stroke-width="1.25" stroke-opacity="0.22" stroke-dasharray="5 12"/>
    </g>
  </g>

  <!-- Main character (whole-card float is applied via CSS on the <img>) -->
  <g filter="url(#cpBotDrop)">
    <!-- Hover base -->
    <ellipse cx="110" cy="168" rx="38" ry="9" fill="#725aee" opacity="0.14"/>

    <!-- Torso -->
    <path d="M78 118 L142 118 L136 168 L84 168 Z" fill="url(#cpBotBody)" stroke="#725aee" stroke-width="2.25" stroke-linejoin="round"/>
    <rect x="92" y="128" width="36" height="28" rx="8" fill="#ffffff" stroke="#725aee" stroke-width="1.5" opacity="0.95"/>
    <path pathLength="100" d="M98 142 L108 134 L118 142 L128 132" stroke="#725aee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.35;0.65;1" dur="3.2s" repeatCount="indefinite"/>
    </path>

    <!-- Neck -->
    <rect x="100" y="104" width="20" height="18" rx="6" fill="#e8e2ff" stroke="#725aee" stroke-width="2"/>

    <!-- Head dome -->
    <ellipse cx="110" cy="62" rx="48" ry="44" fill="url(#cpBotHead)" stroke="#725aee" stroke-width="2.25"/>

    <!-- Side sensors -->
    <rect x="44" y="52" width="14" height="22" rx="6" fill="#f4f2fd" stroke="#725aee" stroke-width="1.75"/>
    <rect x="162" y="52" width="14" height="22" rx="6" fill="#f4f2fd" stroke="#725aee" stroke-width="1.75"/>

    <!-- Visor -->
    <g clip-path="url(#cpBotVisorClip)">
      <rect x="76" y="58" width="68" height="22" rx="11" fill="url(#cpBotVisor)"/>
      <rect x="74" y="58" width="22" height="22" fill="#ffffff" opacity="0.12">
        <animate attributeName="x" values="72;128;72" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="76" y="58" width="68" height="22" rx="11" stroke="#725aee" stroke-width="1.5" fill="none" opacity="0.5"/>

    <!-- LED row -->
    <circle cx="92" cy="69" r="3" fill="#9b87f5">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="69" r="3" fill="#c4b5fd">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="69" r="3" fill="#9b87f5">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Antenna -->
    <g transform="translate(110, 22)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-10 0 0; 10 0 0; -10 0 0" dur="2s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="-14" stroke="#725aee" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="0" cy="-16" r="4" fill="#725aee"/>
        <circle cx="0" cy="-16" r="1.5" fill="#e8e2ff"/>
      </g>
    </g>

    <!-- Arms -->
    <path d="M78 124 L52 118 Q46 116 44 122 L42 138 Q44 146 52 144 L74 132" fill="#ede9fe" stroke="#725aee" stroke-width="2" stroke-linejoin="round"/>
    <path d="M142 124 L168 118 Q174 116 176 122 L178 138 Q176 146 168 144 L146 132" fill="#ede9fe" stroke="#725aee" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
