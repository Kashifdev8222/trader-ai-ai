<div class="ta-page">
  <!-- div.page-header in reference (flex row); avoid <header> / h1 quirks with global CSS -->
  <div class="ta-page-header">
    <h1 class="ta-page-title">Accounts</h1>
    <div class="ta-page-actions">
      <div class="ta-type-wrap">
        <button type="button" class="ta-type-btn" id="taTypeBtn" aria-expanded="false" aria-haspopup="listbox">
          <span class="ta-type-btn-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.75"/></svg>
          </span>
          <span id="taTypeLabel">Real Account</span>
          <span class="ta-type-chevron" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
          </span>
        </button>
        <div class="ta-type-menu" id="taTypeMenu" hidden role="listbox">
          <button type="button" class="ta-type-option" data-kind="real" role="option">Real Account</button>
          <button type="button" class="ta-type-option" data-kind="demo" role="option">Demo Account</button>
        </div>
      </div>
      <button type="button" class="ta-btn-create" id="taCreateAccount">+ Create Account</button>
    </div>
  </div>

  <section class="ta-stats-section" aria-labelledby="taStatsHeading">
    <h2 id="taStatsHeading" class="visually-hidden">Total balance</h2>
    <div class="ta-balance-label">Total Balance</div>
    <div class="ta-balance-value" id="taTotalBalance">$ 0.00</div>
  </section>

  <section class="ta-section ta-section--accounts">
    <div class="ta-table-section-head">
      <h2 class="ta-table-section-title">Accounts</h2>
    </div>
    <div class="ta-table-shell">
      <div class="ta-table-responsive">
        <table class="ta-table">
          <thead>
            <tr>
              <th scope="col">TP Number</th>
              <th scope="col">Balance</th>
              <th scope="col">Currency</th>
              <th scope="col">Status</th>
              <th scope="col">Last Sync Time</th>
              <th scope="col" class="ta-th-actions">Actions</th>
            </tr>
          </thead>
          <tbody id="taTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="ta-pagination" id="taPagination" aria-label="Accounts pagination"></div>
  </section>
</div>

<div class="modal fade" id="taEditNameModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content ta-modal">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-semibold">Edit account name</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body pt-2">
        <form id="taEditNameForm">
          <input type="hidden" id="taEditAccountId" />
          <label class="form-label small text-muted" for="taEditAccountName">Account name</label>
          <input type="text" class="form-control" id="taEditAccountName" required maxlength="120" />
          <div id="taEditMsg" class="small mt-2 text-center"></div>
          <div class="d-flex justify-content-end gap-2 mt-3">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn ta-modal-submit">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
