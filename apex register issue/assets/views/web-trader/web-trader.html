<div class="wt-root">
  <!-- Partner Web Trader loads directly in the iframe; account selection is only inside their UI. -->
  <div class="wt-trader" id="wtTrader">
    <div class="wt-trader-toolbar wt-trader-toolbar--minimal">
      
    </div>
    <p id="wtError" class="wt-toolbar-error" role="alert" hidden></p>
    <div class="wt-frame-wrap">
      <iframe id="wtFrame" class="wt-frame" src="about:blank" title="Web Trader" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <div class="wt-status" id="wtStatus" aria-live="polite"></div>
  </div>
</div>
